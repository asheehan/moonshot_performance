# fly.toml app configuration file generated for moonshot_performance
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "moonshot-performance"
primary_region = "ord"

[build]
  [build.args]
    ELIXIR_VERSION = "1.16.1"
    ERLANG_VERSION = "26.2.3"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "moonshot-performance.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "uploads_data"
  destination = "/app/priv/uploads"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
